function shade(hex,amt){ let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  const n=parseInt(c,16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

// ---------- fighters ----------
class Fighter{
  constructor(def,x,facing,ctrl){
    Object.assign(this,{def,x,y:GROUND,vx:0,vy:0,facing,ctrl,hp:100,ghost:100,ghostT:0,meter:0,state:'idle',t:0,hitstun:0,cool:0,blocking:false,hitDone:false,flash:0,anim:0,combo:0,comboT:0,air:false,squash:0,

  }
  input(){
    if(this.ctrl==='cpu') return this.ai();
    const m=this.ctrl===1?MAP1:MAP2, i={};
    for(const k in m){ i[k]=!!keys[m[k]] || !!pressed[m[k]] || (this.ctrl===1 && isTouch && (!!touch[k]||!!pressed['T_'+k])); pressed[m[k]]=false; if(this.ctrl===1) pressed['T_'+k]=false; }
    return i;
  }
  ai(){
    const o=game.other(this), d=o.x-this.x, ad=Math.abs(d), i={};
    if(game.phase==='finish') return i;
    this.aiT=(this.aiT||0)-1;
    if(this.aiT<=0){ this.aiT=8+Math.random()*12; this.aiMood=Math.random(); }
    const lvl=game.cpuLevel;
    if(o.state==='attack' && ad<150 && this.aiMood<0.35*lvl) i.block=true;
    else if(ad>130){ if(this.aiMood<0.75) i[d>0?'right':'left']=true; if(this.meter>=50 && Math.random()<0.03*lvl) i.special=true; if(Math.random()<0.01) i.up=true; }
    else { if(Math.random()<0.12*lvl) i[Math.random()<0.6?'punch':'kick']=true; if(this.aiMood>0.85) i[d>0?'left':'right']=true; if(Math.random()<0.015) i.up=true; }
    return i;
  }
  update(){
    const o=game.other(this);
    this.anim++; if(this.state==='ko') this.koT=(this.koT||0)+1; if(this.flash>0)this.flash--; if(this.cool>0)this.cool--; if(this.comboT>0)this.comboT--; else this.combo=0;
    if(this.squash>0)this.squash*=0.8;
    if(this.ghostT>0)this.ghostT--; else if(this.ghost>this.hp) this.ghost=Math.max(this.hp,this.ghost-0.6);
    if(this.state!=='attack' && this.state!=='ko' && this.state!=='dazed' && this.y>=GROUND) this.facing = o.x>this.x?1:-1;
    const canAct=game.phase==='fight'||(game.phase==='finish'&&game.fin&&game.fin.winner===this);
    const inp=canAct?this.input():{};
    if(game.phase==='finish' && game.fin.winner===this && inp.special && this.state!=='attack'){ startFatal(); return; }
    if(this.state==='ko'||this.state==='dazed'){ if(this.y>=GROUND) this.vx*=0.85; }
    else if(this.hitstun>0){ this.hitstun--; if(!this.hitstun) this.state='idle'; }
    else if(this.state==='attack'){
      this.t++; const a=this.atk;
      if(a.kind!=='special' && this.t===a.startup) this.vx+=this.facing*(a.kind==='kick'?3:2);
      if(this.t>=a.startup && this.t<a.startup+a.active && !this.hitDone){
        const hx=this.x+this.facing*a.reach*BS, hy=this.y-a.h*BS;

function onKey(code){
  if(game.screen==='title'){
    if(code==='Digit1'||code==='T_punch'){game.mode='cpu';toSelect();}
    else if(code==='Digit2'){game.mode='2p';toSelect();}
  } else if(game.screen==='select'){
    const t=game.selTurn, n=ROSTER.length;
    if(code==='KeyA'||code==='ArrowLeft'||code==='T_left') game.sel[t]=(game.sel[t]+n-1)%n, sfx(500,0.03);
    if(code==='KeyD'||code==='ArrowRight'||code==='T_right') game.sel[t]=(game.sel[t]+1)%n, sfx(500,0.03);
    if(code==='KeyW'||code==='ArrowUp'||code==='T_up') game.sel[t]=Math.max(0,game.sel[t]-COLS);
    if(code==='KeyS'||code==='ArrowDown'||code==='T_block') game.sel[t]=Math.min(n-1,game.sel[t]+COLS);
    if(code==='Enter'||code==='KeyF'||code==='KeyK'||code==='Space'||code==='T_punch') confirmSel();
    if(code==='Escape') game.screen='title';
  } else if(game.screen==='vs'){
    if(code==='Enter'||code==='Space'||code==='T_punch') endVS();
  } else if(game.screen==='over'){
    if(game.screenT>40&&(code==='Enter'||code==='Space'||code==='T_punch')) game.screen='title';
  } else if(game.screen==='fight' && code==='Escape'){ game.screen='title'; }
}
function toSelect(){game.screen='select';game.selTurn=0;game.screenT=0;sfx(500,0.08);}
function endVS(){ game.startRound(); game.screen='fight'; }
function confirmSel(){

  else game.startMatch();
}
function onTap(x,y){
  if(game.screen==='title'){ if(y>300&&y<360){game.mode='cpu';toSelect();} else if(y>370&&y<430){game.mode='2p';toSelect();} }
  else if(game.screen==='select'){
    const i=cardAt(x,y); if(i>=0){ if(game.sel[game.selTurn]===i) confirmSel(); else {game.sel[game.selTurn]=i; sfx(500,0.05);} }
  } else if(game.screen==='vs') endVS();
  else if(game.screen==='over'&&game.screenT>40) game.screen='title';
}

function drawHUD(){

function drawParticles(){
  for(const p of game.particles){ const k=p.l/p.ml;
    if(p.type==='spark'){ ctx.strokeStyle=p.c; ctx.globalAlpha=k; ctx.lineWidth=3*k+1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2); ctx.stroke(); }
    else if(p.type==='ring'){ ctx.strokeStyle=p.c; ctx.globalAlpha=k; ctx.lineWidth=5*k; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.2-k),0,7); ctx.stroke(); }
    else if(p.type==='dust'){ ctx.fillStyle='#d8cfc0'; ctx.globalAlpha=k*.45; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.6-k),0,7); ctx.fill(); }
    else if(p.type==='dot'){ ctx.fillStyle=p.c; ctx.globalAlpha=k*.8; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*k,0,7); ctx.fill(); }
    else if(p.type==='drop'){ ctx.fillStyle='#cfe8ff'; ctx.globalAlpha=k*.8; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    else if(p.type==='rock'){ ctx.fillStyle='#5a4a3a'; ctx.globalAlpha=Math.min(1,k*2); ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); }
    else if(p.type==='confetti'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.min(1,k*3); ctx.fillRect(-5,-3,10,6); ctx.restore(); }
  } ctx.globalAlpha=1;
  for(const p of game.popups){ const s=p.t<6?0.4+p.t*.15:1; ctx.save(); ctx.globalAlpha=Math.min(1,(40-p.t)/12); ctx.translate(p.x,p.y-p.t*(p.fixed?0.3:1.2)); ctx.scale(s,s); ctx.rotate(p.fixed?0:-0.12);
    ctx.font=`900 italic ${p.size}px system-ui`; ctx.textAlign='center'; ctx.lineJoin='round'; ctx.lineWidth=p.size*.25; ctx.strokeStyle='#000'; ctx.strokeText(p.text,0,0); ctx.fillStyle=p.c; ctx.fillText(p.text,0,0); ctx.restore(); }
}
function rays(cx,cy,col,n=16,spd=.3){ const t=performance.now()/1000*spd; ctx.save(); ctx.translate(cx,cy); ctx.rotate(t); ctx.fillStyle=col; for(let i=0;i<n;i++){ ctx.rotate(Math.PI*2/n); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(900,-60); ctx.lineTo(900,60); ctx.fill(); } ctx.restore(); }
function button(label,y,hot){ const w=340,x=W/2-w/2,t=performance.now()/1000;

    ctx.lineWidth=hot?4:1.5; ctx.strokeStyle=sel0?'#ff3355':sel1?'#2aa8ff':'#ffffff30'; if(hot){ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=18;} ctx.stroke(); ctx.shadowBlur=0;

    ctx.restore();
  });

  ctx.fillStyle='#000a'; rr(ctx,W/2-300,398,600,74,14); ctx.fill(); ctx.strokeStyle=r.spColor; ctx.lineWidth=2; ctx.stroke();
  face(r.id,W/2-262,435,26,r.spColor);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='900 italic 22px system-ui';ctx.fillText(r.name.toUpperCase(),W/2-222,428);
  const stat=(lab,v,x)=>{ ctx.font='bold 12px system-ui'; ctx.fillStyle='#aaa'; ctx.fillText(lab,x,454); for(let k=0;k<5;k++){ ctx.fillStyle=k<v?'#ffcc00':'#ffffff22'; ctx.fillRect(x+70+k*13,445,10,10);} };
  stat('VELOCIDAD',Math.round(r.speed-1.0)-2,W/2-222); stat('FUERZA',Math.round(r.power*5-1.2),W/2-70);
  ctx.textAlign='right'; ctx.font='bold 14px system-ui'; ctx.fillStyle=r.spColor; ctx.fillText(r.spEmoji+' '+r.spName,W/2+285,428);
  ctx.font='14px system-ui';ctx.fillStyle='#bbb';ctx.textAlign='center';
  ctx.fillText(isTouch?'Toca una carta para elegir, tócala otra vez para confirmar':'Flechas o WASD para elegir · ENTER para confirmar · ESC volver',W/2,506);
}
function drawVS(){
  const t=game.screenT, a=ROSTER[game.sel[0]], b=ROSTER[game.sel[1]];
  const slide=Math.min(1,t/18), ease=1-Math.pow(1-slide,3);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W/2+60,0); ctx.lineTo(W/2-60,H); ctx.lineTo(0,H); ctx.clip();
  let g=ctx.createLinearGradient(0,0,W/2,0); g.addColorStop(0,'#5a0010'); g.addColorStop(1,'#ff3355'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); rays(W/4,H/2,'#ffffff10',14,.4);
  face(a.id,-200+ease*(W/4+200),H/2-20,130,'#fff',a.spColor); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.moveTo(W/2+60,0); ctx.lineTo(W,0); ctx.lineTo(W,H); ctx.lineTo(W/2-60,H); ctx.clip();
  g=ctx.createLinearGradient(W/2,0,W,0); g.addColorStop(0,'#2aa8ff'); g.addColorStop(1,'#001a4a'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); rays(W*3/4,H/2,'#ffffff10',14,-.4);
  face(b.id,W+200-ease*(W/4+200),H/2-20,130,'#fff',b.spColor); ctx.restore();
  ctx.strokeStyle='#fff'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(W/2+60,0); ctx.lineTo(W/2-60,H); ctx.stroke();
  const s=t<18?0:Math.max(1,3-(t-18)*.2); if(t>=18) bigText('VS',H/2-20,110,'#fff6a0','#ff6a00',s);
  const nm=(n,x,al)=>{ ctx.font='900 italic 30px system-ui'; ctx.textAlign=al; ctx.lineWidth=7; ctx.strokeStyle='#000'; ctx.strokeText(n.toUpperCase(),x,H-70); ctx.fillStyle='#fff'; ctx.fillText(n.toUpperCase(),x,H-70); };
  if(t>10){ nm(a.name,40,'left'); nm(b.name,W-40,'right'); }
  ctx.fillStyle='#000c'; rr(ctx,W/2-190,H-46,380,32,16); ctx.fill(); ctx.font='bold 15px system-ui'; ctx.textAlign='center'; ctx.fillStyle='#ffcc00'; ctx.fillText('ESCENARIO: '+STAGE_NAMES[game.stageKey].toUpperCase(),W/2,H-24);

function drawOver(){
  const w=game.wins[0]>game.wins[1]?0:1, f=ROSTER[game.sel[w]], t=performance.now()/1000;
  drawStage(0); ctx.fillStyle='#000b'; ctx.fillRect(0,0,W,H); rays(W/2,210,f.spColor+'22',20,.25);
  if(game.screenT%3===0) game.particles.push({type:'confetti',x:Math.random()*W,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*2,l:200,ml:200,a:Math.random()*6,c:['#ffcc00','#ff3355','#2aa8ff','#3ee66b','#fff'][Math.floor(Math.random()*5)]});
  game.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a=(p.a||0)+.1;p.l--;}); game.particles=game.particles.filter(p=>p.l>0&&p.y<H+20);
  face(f.id,W/2,210+Math.sin(t*3)*6,110,'#ffcc00',f.spColor);
  ctx.font='60px serif'; ctx.textAlign='center'; ctx.fillText('👑',W/2,98+Math.sin(t*3)*6);
  drawParticles();
  bigText('¡GANA '+f.name.toUpperCase()+'!',382,f.name.length>14?36:46);
  ctx.font='bold 15px system-ui'; ctx.fillStyle='#ffcc00'; ctx.textAlign='center'; ctx.fillText(game.wins[w]+' - '+game.wins[1-w]+(game.lastFatal?'   ·   REMATE: '+game.lastFatal:''),W/2,425);
  ctx.font='16px system-ui';ctx.fillStyle='#fff';ctx.fillText(isTouch?'Toca para volver al menú':'ENTER para volver al menú',W/2,470);
}

function step(){
  game.screenT++;
  if(game.screen!=='fight') return;
  if(game.freeze>0){ game.freeze--; return; }
  game.phaseT++;
  if(game.phase==='intro'&&game.phaseT===60) sfx(330,0.15);
  if(game.phase==='intro'&&game.phaseT>100){game.phase='fight';game.phaseT=0;game.msg='';sfx(440,0.25);}
  if(game.phase==='fight'){ game.timer-=1/60; if(game.timer<=0){ game.timer=0; const [a,b]=game.fighters; game.phase='ko';game.phaseT=0; game.msg='¡TIEMPO!'; if(a.hp!==b.hp) game.wins[a.hp>b.hp?0:1]++; } }
  if(game.phase==='finish') stepFinish();
  if(game.phase==='fatal') stepFatal(); else game.fighters.forEach(f=>f.update());
  game.projectiles.forEach(p=>p.update()); game.projectiles=game.projectiles.filter(p=>!p.dead);
  game.particles.forEach(p=>{ if(p.type!=='ring'){p.x+=p.vx;p.y+=p.vy;
      if(p.type==='spark')p.vy+=0.4; else if(p.type==='drop'||p.type==='rock'){p.vy+=0.45; if(p.y>GROUND){p.y=GROUND;p.vy*=-.3;p.vx*=.6;}} else if(p.type==='dust'){p.vx*=.95;p.vy*=.95;} else if(p.type==='confetti'){p.vy+=.18;p.vx*=.97;p.vy*=.98;p.a+=.15; if(p.y>GROUND+20){p.y=GROUND+20;p.vy=0;p.vx*=.8;}} }
    p.l--;}); game.particles=game.particles.filter(p=>p.l>0);
  game.popups.forEach(p=>p.t++); game.popups=game.popups.filter(p=>p.t<40);
  if(game.shake>0)game.shake--; if(game.flashT>0)game.flashT--;
  if(game.phase==='ko'&&game.phaseT>170){
    if(game.wins[0]>=2||game.wins[1]>=2){ game.screen='over'; game.screenT=0; game.particles=[]; game.popups=[]; }
    else { game.round++; game.startRound(); }
  }
}
function drawFighters(opt){
  const order=[...game.fighters].sort((p,q)=>(p.state==='attack'||p.state==='win')-(q.state==='attack'||q.state==='win'));
  for(const f of order){ if(f.fx.clip){ ctx.save(); ctx.beginPath(); ctx.rect(-500,-500,W+1000,GROUND+505); ctx.clip(); f.draw(opt); ctx.restore(); } else f.draw(opt); }
}
function render(){
  ctx.lineJoin='round';
  if(game.screen==='title') return drawTitle();
  if(game.screen==='select') return drawSelect();
  if(game.screen==='vs') return drawVS();
  if(game.screen==='over') return drawOver();
  const [a,b]=game.fighters, cam=clamp((a.x+b.x)/2-W/2,-400,400);
  const z=game.zoom; z.s+=(z.ts-z.s)*.07; z.x+=(z.tx-z.x)*.07; z.y+=(z.ty-z.y)*.07;
  const hw=W/(2*z.s), hh=H/(2*z.s), cx=clamp(z.x,hw,W-hw), cy=clamp(z.y,hh,H-hh);
  ctx.save();
  ctx.translate(W/2,H/2); ctx.scale(z.s,z.s); ctx.translate(-cx,-cy);
  if(game.shake) ctx.translate((Math.random()-.5)*game.shake,(Math.random()-.5)*game.shake);
  drawStage(cam);
  drawFatalBack();
  if(stage.reflect>0){ ctx.save(); ctx.beginPath(); ctx.rect(-200,GROUND,W+400,H); ctx.clip(); ctx.translate(0,2*GROUND); ctx.scale(1,-1); ctx.globalAlpha=stage.reflect; drawFighters({reflect:true}); ctx.restore(); ctx.globalAlpha=1; }
  drawFighters();
  game.projectiles.forEach(p=>p.draw());
  drawFatalFront();
  drawParticles();
  drawForeground(cam);
  ctx.restore();
  postFX();
  if(game.phase==='finish' && game.fin) drawFinishOverlay();
  const lt=game.phase==='fatal'?1:0; game.letter+=(lt-game.letter)*.1;
  if(game.letter>.01){ ctx.fillStyle='#000'; ctx.fillRect(0,0,W,52*game.letter); ctx.fillRect(0,H-52*game.letter,W,52*game.letter); }
  if(game.letter<.5) drawHUD();
  if(game.flashT>0){ ctx.fillStyle=`rgba(255,255,255,${game.flashT/14})`; ctx.fillRect(0,0,W,H); }
  if(game.msg){ const k=game.phaseT, isF=game.phase==='fatal'; const s=isF?Math.max(1,2.2-(game.fatal.t-game.fatal.end)*.12):(k<10?2.2-k*.12:1);
    const size=isF?(game.msg.length>18?44:56):(game.msg==='¡K.O.!'?110:72);
    bigText(game.msg,isF?118:H/2-20,size,isF?'#ffe0e0':'#fff6a0',isF?'#ff2244':'#ff6a00',s);
    if(game.sub){ ctx.font='900 italic 26px system-ui'; ctx.textAlign='center'; ctx.lineWidth=6; ctx.strokeStyle='#000'; const sy=isF?172:H/2+40; ctx.strokeText(game.sub,W/2,sy); ctx.fillStyle='#ffcc00'; ctx.fillText(game.sub,W/2,sy); } }
  if(game.phase==='intro'&&game.phaseT>60){ const k=game.phaseT-60; bigText('¡PELEEN!',H/2+70,56,'#ffffff','#ff3355',k<8?2-k*.125:1); }
}
let last=performance.now(),acc=0,frame=0;
function loop(now){ acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ frame++; if(game.slow>0){ game.slow--; if(frame%3===0) step(); else game.screenT++; } else step(); acc-=1000/60; }
  render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
